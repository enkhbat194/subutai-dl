name: Subutai N5 Production Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "engines/native/**"
      - "apps/**"
      - "packages/**"
      - "scripts/mirror-policy-test.mts"
      - "scripts/resilience-download-test.mjs"
      - "scripts/native-soak-benchmark.mjs"
      - "scripts/publish-native-soak-summary.mjs"
      - "scripts/native-large-queue-benchmark.mjs"
      - "scripts/publish-native-large-queue-summary.mjs"
      - "scripts/restart-recovery-harness.mjs"
      - "scripts/restart-recovery-policy-test.mjs"
      - "scripts/install-temporary-media-tools.ps1"
      - "scripts/n5-windows-acceptance.ps1"
      - "scripts/production-acceptance-policy-test.mjs"
      - "scripts/real-two-installer-acceptance.ps1"
      - "scripts/real-update-state-probe.mjs"
      - "scripts/real-update-feed-server.mjs"
      - "scripts/real-update-acceptance-policy-test.mjs"
      - "scripts/validate-windows-package.ps1"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/n5-production-acceptance.yml"
      - ".github/workflows/real-update-acceptance.yml"
      - ".github/workflows/restart-recovery.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-acceptance:
    name: n5-subutai-windows
    runs-on: [self-hosted, Windows, X64, subutai]
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Rust toolchain
        shell: powershell
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $rustupInstaller = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
            Invoke-WebRequest "https://win.rustup.rs/x86_64" -OutFile $rustupInstaller
            & $rustupInstaller -y --profile minimal --default-toolchain none
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $env:PATH = "$cargoBin;$env:PATH"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.97.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enable pnpm
        shell: powershell
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install locked dependencies
        shell: powershell
        run: pnpm install --frozen-lockfile

      - name: Install pinned temporary media tools
        shell: powershell
        run: ./scripts/install-temporary-media-tools.ps1

      - name: Verify native engine and product policies
        shell: powershell
        run: |
          pnpm test:native-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:restart-policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:telemetry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:dependency-lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:release-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:release-signing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:integrity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:mirror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:brand
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:production-acceptance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build production native CLI for recovery and benchmarks
        shell: powershell
        run: cargo build --release --manifest-path engines/native/Cargo.toml --bin subutai-engine

      - name: Run two-phase restart recovery harness self-test
        shell: powershell
        env:
          SUBUTAI_RESTART_WORKSPACE: ${{ github.workspace }}\artifacts\n5\restart-harness-n5
          SUBUTAI_RESTART_FILE_MIB: 32
          SUBUTAI_RESTART_MINIMUM_PROGRESS_MIB: 4
        run: pnpm test:native-restart-harness

      - name: Run native resource soak benchmark
        shell: powershell
        env:
          SUBUTAI_SOAK_ITERATIONS: 8
          SUBUTAI_SOAK_MIB: 8
          SUBUTAI_SOAK_SEGMENTS: 8
          SUBUTAI_SOAK_REPORT: artifacts/n5/native-soak-report.json
        run: pnpm test:native-soak

      - name: Publish native soak telemetry
        shell: powershell
        env:
          SUBUTAI_SOAK_REPORT: artifacts/n5/native-soak-report.json
        run: node scripts/publish-native-soak-summary.mjs

      - name: Run native large-file and queue benchmark
        shell: powershell
        env:
          SUBUTAI_BENCHMARK_LARGE_MIB: 128
          SUBUTAI_BENCHMARK_QUEUE_JOBS: 12
          SUBUTAI_BENCHMARK_QUEUE_MIB: 16
          SUBUTAI_BENCHMARK_CONCURRENCY: 3
          SUBUTAI_BENCHMARK_REPORT: artifacts/n5/native-large-queue-report.json
        run: pnpm test:native-large-queue

      - name: Publish native large-file and queue telemetry
        shell: powershell
        env:
          SUBUTAI_BENCHMARK_REPORT: artifacts/n5/native-large-queue-report.json
        run: node scripts/publish-native-large-queue-summary.mjs

      - name: Run native process and network resilience
        shell: powershell
        env:
          SUBUTAI_RESILIENCE_MB: 16
        run: pnpm test:resilience

      - name: Build Setup and Portable packages
        shell: powershell
        run: pnpm --filter @subutai/desktop build:win

      - name: Validate packaged application
        shell: powershell
        run: ./scripts/validate-windows-package.ps1 -LaunchSmoke

      - name: Accept portable, installed and uninstalled product
        shell: powershell
        run: ./scripts/n5-windows-acceptance.ps1
