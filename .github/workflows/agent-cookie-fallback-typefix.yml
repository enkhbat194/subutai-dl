name: Agent one-shot media fallback typefix

on:
  push:
    branches:
      - agent/media-cookie-fallback-precedence
    paths:
      - ".github/workflows/agent-cookie-fallback-typefix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/media-cookie-fallback-precedence
      - name: Fix indexed argument narrowing
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/desktop/src/main/engines/media-service.ts")
          text = path.read_text(encoding="utf-8")
          old = "        browserArgs.push(argument);"
          new = "        if (argument !== undefined) browserArgs.push(argument);"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one match, got {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "subutai-agent"
          git config user.email "actions@users.noreply.github.com"
          git add apps/desktop/src/main/engines/media-service.ts
          git commit -m "Fix cookie fallback argument narrowing"
          git push origin HEAD:agent/media-cookie-fallback-precedence
