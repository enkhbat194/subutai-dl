name: Subutai Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Stable release tag matching package version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: pwsh
        run: corepack enable

      - name: Validate release tag and package versions
        shell: pwsh
        run: node scripts/validate-release-version.mjs "$env:RELEASE_TAG"

      - name: Install Subutai download engines
        shell: pwsh
        run: |
          choco install aria2 yt-dlp ffmpeg -y --no-progress
          $engineDir = "apps/desktop/resources/engines/win32-x64"
          New-Item -ItemType Directory -Force $engineDir | Out-Null

          $aria = Get-ChildItem "$env:ChocolateyInstall\lib\aria2*" -Recurse -Filter aria2c.exe | Select-Object -First 1
          $ytdlp = Get-ChildItem "$env:ChocolateyInstall\lib\yt-dlp*" -Recurse -Filter yt-dlp.exe | Select-Object -First 1
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg*" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg*" -Recurse -Filter ffprobe.exe | Select-Object -First 1

          if (-not $aria) { throw "Subutai direct-download engine was not found." }
          if (-not $ytdlp) { throw "Subutai media resolver was not found." }
          if (-not $ffmpeg) { throw "Subutai media processor was not found." }

          Copy-Item $aria.FullName "$engineDir/aria2c.exe"
          Copy-Item $ytdlp.FullName "$engineDir/yt-dlp.exe"
          Copy-Item $ffmpeg.FullName "$engineDir/ffmpeg.exe"
          if ($ffprobe) { Copy-Item $ffprobe.FullName "$engineDir/ffprobe.exe" }

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck and release policies
        shell: pwsh
        run: |
          pnpm typecheck
          pnpm test:system
          pnpm test:failure-policy

      - name: Build Windows installer and portable app
        shell: pwsh
        run: pnpm --filter @subutai/desktop build:win

      - name: Validate release packages and launch
        shell: pwsh
        run: ./scripts/validate-windows-package.ps1 -LaunchSmoke

      - name: Preserve release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Subutai-${{ env.RELEASE_TAG }}-Windows
          path: |
            apps/desktop/release/Subutai-Setup-*.exe
            apps/desktop/release/Subutai-Portable-*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Subutai Download Manager ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/Subutai-Setup-*.exe
            apps/desktop/release/Subutai-Portable-*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS.txt
