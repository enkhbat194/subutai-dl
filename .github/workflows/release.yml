name: Subutai Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Stable release tag matching package version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 170
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.97.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate release tag and package versions
        shell: pwsh
        run: node scripts/validate-release-version.mjs "$env:RELEASE_TAG"

      - name: Install locked dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Install pinned temporary media tools
        shell: pwsh
        run: ./scripts/install-temporary-media-tools.ps1

      - name: Verify native engine and release policies
        shell: pwsh
        run: |
          pnpm test:native-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:telemetry
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:release-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:dependency-lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:integrity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:mirror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:brand
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:production-acceptance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:system
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:failure-policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build production native CLI for extended benchmarks
        shell: pwsh
        run: cargo build --release --manifest-path engines/native/Cargo.toml --bin subutai-engine

      - name: Run extended native resource soak benchmark
        shell: pwsh
        env:
          SUBUTAI_SOAK_ITERATIONS: 16
          SUBUTAI_SOAK_MIB: 32
          SUBUTAI_SOAK_SEGMENTS: 8
          SUBUTAI_SOAK_REPORT: artifacts/n5/native-soak-report.json
        run: pnpm test:native-soak

      - name: Publish extended native soak telemetry
        shell: pwsh
        env:
          SUBUTAI_SOAK_REPORT: artifacts/n5/native-soak-report.json
        run: node scripts/publish-native-soak-summary.mjs

      - name: Run extended native large-file and queue benchmark
        shell: pwsh
        env:
          SUBUTAI_BENCHMARK_LARGE_MIB: 512
          SUBUTAI_BENCHMARK_QUEUE_JOBS: 32
          SUBUTAI_BENCHMARK_QUEUE_MIB: 16
          SUBUTAI_BENCHMARK_CONCURRENCY: 8
          SUBUTAI_BENCHMARK_SEGMENTS: 8
          SUBUTAI_BENCHMARK_MAX_QUEUE_WORKING_SET_MIB: 2048
          SUBUTAI_BENCHMARK_MAX_QUEUE_PRIVATE_MIB: 2048
          SUBUTAI_BENCHMARK_MAX_QUEUE_HANDLES: 8192
          SUBUTAI_BENCHMARK_REPORT: artifacts/n5/native-large-queue-report.json
        run: pnpm test:native-large-queue

      - name: Publish extended native large-file and queue telemetry
        shell: pwsh
        env:
          SUBUTAI_BENCHMARK_REPORT: artifacts/n5/native-large-queue-report.json
        run: node scripts/publish-native-large-queue-summary.mjs

      - name: Run native process and network resilience
        shell: pwsh
        env:
          SUBUTAI_RESILIENCE_MB: 16
        run: pnpm test:resilience

      - name: Build Windows installer and portable app
        shell: pwsh
        run: pnpm --filter @subutai/desktop build:win

      - name: Validate release packages and launch
        shell: pwsh
        run: ./scripts/validate-windows-package.ps1 -LaunchSmoke

      - name: Accept portable, installed and uninstalled release
        shell: pwsh
        run: ./scripts/n5-windows-acceptance.ps1

      - name: Preserve secondary CI artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Subutai-${{ env.RELEASE_TAG }}-Windows
          path: |
            apps/desktop/release/Subutai-Setup-*.exe
            apps/desktop/release/Subutai-Portable-*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS.txt
            artifacts/n5/native-soak-report.json
            artifacts/n5/native-large-queue-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Subutai Download Manager ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/Subutai-Setup-*.exe
            apps/desktop/release/Subutai-Portable-*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS.txt
            artifacts/n5/native-soak-report.json
            artifacts/n5/native-large-queue-report.json
