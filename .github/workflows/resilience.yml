name: Subutai Resilience

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      large_file_mb:
        description: Large-file validation size in MB
        required: false
        default: "1024"
  schedule:
    - cron: "20 2 * * 0"

permissions:
  contents: read

jobs:
  interruption-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install aria2 on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y aria2
      - name: Install aria2 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install aria2 -y --no-progress
      - name: Crash and network interruption suite
        shell: bash
        env:
          SUBUTAI_RESILIENCE_MB: "64"
        run: node scripts/resilience-download-test.mjs

  scheduled-large-file:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2
      - name: Large-file crash and network interruption suite
        env:
          SUBUTAI_RESILIENCE_MB: ${{ github.event.inputs.large_file_mb || '1024' }}
        run: node scripts/resilience-download-test.mjs
