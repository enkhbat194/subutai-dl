name: Subutai CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install Subutai runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y aria2 yt-dlp ffmpeg

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Queue and scheduler policy tests
        run: pnpm test:queue

      - name: Transfer control policy tests
        run: pnpm test:transfer

      - name: Batch and numbered URL tests
        run: pnpm test:batch

      - name: Clipboard monitoring policy tests
        run: pnpm test:clipboard

      - name: Site Grabber local crawl tests
        run: pnpm test:site-grabber

      - name: System tray and updater policy tests
        run: pnpm test:system

      - name: Failure and recovery policy tests
        run: pnpm test:failure-policy

      - name: Build desktop
        run: pnpm build

      - name: Real segmented-download smoke test
        run: pnpm test:aria2

      - name: Real HLS media smoke test
        run: pnpm test:media
