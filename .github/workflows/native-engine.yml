name: Subutai Native Engine

on:
  push:
    branches: [main]
    paths:
      - "engines/native/**"
      - "docs/NATIVE_ENGINE_LOCKED_PLAN.md"
      - "docs/NATIVE_ENGINE_IPC.md"
      - "rust-toolchain.toml"
      - "package.json"
      - ".github/workflows/native-engine.yml"
  pull_request:
    branches: [main]
    paths:
      - "engines/native/**"
      - "docs/NATIVE_ENGINE_LOCKED_PLAN.md"
      - "docs/NATIVE_ENGINE_IPC.md"
      - "rust-toolchain.toml"
      - "package.json"
      - ".github/workflows/native-engine.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-engine:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          rustc --version --verbose
          cargo --version

      - name: Formatting
        run: cargo fmt --manifest-path engines/native/Cargo.toml --all -- --check

      - name: Static checks
        run: cargo clippy --manifest-path engines/native/Cargo.toml --all-targets -- -D warnings

      - name: Unit and protocol tests
        run: cargo test --manifest-path engines/native/Cargo.toml --all-targets

      - name: Durable journal self-test
        run: cargo run --quiet --manifest-path engines/native/Cargo.toml -- self-test
