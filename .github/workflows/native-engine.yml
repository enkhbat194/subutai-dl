name: Subutai Native Engine

on:
  push:
    branches: [main]
    paths:
      - "engines/native/**"
      - "docs/NATIVE_ENGINE_LOCKED_PLAN.md"
      - "docs/NATIVE_ENGINE_IPC.md"
      - "docs/PROJECT_STATUS.md"
      - "scripts/native-engine-policy-test.mjs"
      - "scripts/apply-n4-status.mjs"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/native-engine.yml"
  pull_request:
    branches: [main]
    paths:
      - "engines/native/**"
      - "docs/NATIVE_ENGINE_LOCKED_PLAN.md"
      - "docs/NATIVE_ENGINE_IPC.md"
      - "docs/PROJECT_STATUS.md"
      - "scripts/native-engine-policy-test.mjs"
      - "scripts/apply-n4-status.mjs"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/native-engine.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  native-engine:
    name: subutai-windows
    runs-on: [self-hosted, Windows, X64, subutai]
    timeout-minutes: 10

    steps:
      - name: Checkout N4 source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply N4 project status
        shell: powershell
        run: |
          node scripts/apply-n4-status.mjs
          Remove-Item scripts/apply-n4-status.mjs

      - name: Save N4 project status
        shell: powershell
        run: |
          $changes = git status --porcelain
          if ([string]::IsNullOrWhiteSpace($changes)) {
            Write-Host "N4 project status is already applied."
            exit 0
          }
          git config user.name "Subutai Automation"
          git config user.email "subutai-automation@users.noreply.github.com"
          git add -A
          git commit -m "Record N4 desktop replacement verification"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
