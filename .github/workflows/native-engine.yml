name: Subutai Native Engine

on:
  push:
    branches: [main]
    paths:
      - "engines/native/**"
      - "docs/NATIVE_ENGINE_LOCKED_PLAN.md"
      - "docs/NATIVE_ENGINE_IPC.md"
      - "scripts/native-engine-policy-test.mjs"
      - "rust-toolchain.toml"
      - ".github/workflows/native-engine.yml"
  pull_request:
    branches: [main]
    paths:
      - "engines/native/**"
      - "docs/NATIVE_ENGINE_LOCKED_PLAN.md"
      - "docs/NATIVE_ENGINE_IPC.md"
      - "scripts/native-engine-policy-test.mjs"
      - "rust-toolchain.toml"
      - ".github/workflows/native-engine.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  native-engine:
    name: subutai-windows
    runs-on: [self-hosted, Windows, X64, subutai]
    timeout-minutes: 30

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Rust toolchain
        shell: powershell
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $rustupInstaller = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
            Invoke-WebRequest "https://win.rustup.rs/x86_64" -OutFile $rustupInstaller
            & $rustupInstaller -y --profile minimal --default-toolchain none
          }
          $env:PATH = "$cargoBin;$env:PATH"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          rustc --version --verbose
          cargo --version

      - name: Verify Subutai ownership policy
        shell: powershell
        run: node scripts/native-engine-policy-test.mjs

      - name: Apply N0 static-check cleanup
        shell: powershell
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          $ipcPath = "engines/native/src/ipc.rs"
          $ipc = [System.IO.File]::ReadAllText($ipcPath).Replace("`r`n", "`n")
          $ipc = $ipc.Replace(
            "fn try_from(value: u8) -> Result<Self, Self::Error> {",
            "fn try_from(value: u8) -> Result<Self, IpcError> {"
          )
          [System.IO.File]::WriteAllText($ipcPath, $ipc, $utf8)

          $corePath = "engines/native/src/core.rs"
          $core = [System.IO.File]::ReadAllText($corePath).Replace("`r`n", "`n")
          $core = $core.Replace(
            "    encode_manifest, is_supported_http_url,`n};",
            "    encode_manifest, is_supported_http_url, plan_ranges,`n};"
          )
          $corePattern = '(?s)\npub fn plan_ranges\(.*?\n\}\n\n(?=#\[derive\(Debug, Clone\)\]\npub struct JournalStore)'
          $core = [System.Text.RegularExpressions.Regex]::Replace($core, $corePattern, "`n")
          [System.IO.File]::WriteAllText($corePath, $core, $utf8)

          $implPath = "engines/native/src/core_impl.rs"
          $impl = [System.IO.File]::ReadAllText($implPath).Replace("`r`n", "`n")
          $oldPlan = @'
    let maximum_useful_segments = total_size
        .checked_add(minimum_segment_size - 1)
        .ok_or(PlanError::ArithmeticOverflow)?
        / minimum_segment_size;
'@
          $newPlan = @'
    let complete_groups = total_size / minimum_segment_size;
    let maximum_useful_segments = complete_groups
        .checked_add(if total_size.is_multiple_of(minimum_segment_size) {
            0
        } else {
            1
        })
        .ok_or(PlanError::ArithmeticOverflow)?;
'@
          $impl = $impl.Replace($oldPlan.Replace("`r`n", "`n"), $newPlan.Replace("`r`n", "`n"))
          [System.IO.File]::WriteAllText($implPath, $impl, $utf8)

      - name: Format native engine sources
        shell: powershell
        run: cargo fmt --manifest-path engines/native/Cargo.toml --all

      - name: Save cleanup and formatter changes
        shell: powershell
        run: |
          $changes = git status --porcelain -- engines/native
          if ([string]::IsNullOrWhiteSpace($changes)) {
            Write-Host "Native engine source is already clean."
            exit 0
          }
          git config user.name "Subutai Automation"
          git config user.email "subutai-automation@users.noreply.github.com"
          git add engines/native
          git commit -m "Resolve native engine static checks"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"

      - name: Static checks
        shell: powershell
        run: cargo clippy --manifest-path engines/native/Cargo.toml --all-targets -- -D warnings

      - name: Unit and protocol tests
        shell: powershell
        run: cargo test --manifest-path engines/native/Cargo.toml --all-targets

      - name: Durable journal self-test
        shell: powershell
        run: cargo run --quiet --manifest-path engines/native/Cargo.toml -- self-test
