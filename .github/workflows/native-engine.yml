name: Subutai Native Engine

on:
  push:
    branches: [main]
    paths:
      - "engines/native/**"
      - "docs/NATIVE_ENGINE_LOCKED_PLAN.md"
      - "docs/NATIVE_ENGINE_IPC.md"
      - "docs/PROJECT_STATUS.md"
      - "scripts/native-engine-policy-test.mjs"
      - "scripts/release-engine-policy-test.mjs"
      - "scripts/dependency-lock-policy-test.mjs"
      - "scripts/integrity-policy-test.mts"
      - "scripts/mirror-policy-test.mts"
      - "scripts/apply-n5-failure-injection.mjs"
      - "scripts/validate-windows-package.ps1"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/native-engine.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [main]
    paths:
      - "engines/native/**"
      - "docs/NATIVE_ENGINE_LOCKED_PLAN.md"
      - "docs/NATIVE_ENGINE_IPC.md"
      - "docs/PROJECT_STATUS.md"
      - "scripts/native-engine-policy-test.mjs"
      - "scripts/release-engine-policy-test.mjs"
      - "scripts/dependency-lock-policy-test.mjs"
      - "scripts/integrity-policy-test.mts"
      - "scripts/mirror-policy-test.mts"
      - "scripts/apply-n5-failure-injection.mjs"
      - "scripts/validate-windows-package.ps1"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/native-engine.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  native-engine:
    name: subutai-windows
    runs-on: [self-hosted, Windows, X64, subutai]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Rust toolchain
        shell: powershell
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $rustupInstaller = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
            Invoke-WebRequest "https://win.rustup.rs/x86_64" -OutFile $rustupInstaller
            & $rustupInstaller -y --profile minimal --default-toolchain none
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $env:PATH = "$cargoBin;$env:PATH"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.97.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          cargo --version

      - name: Apply N5 failure-injection migration
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: powershell
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          node scripts/apply-n5-failure-injection.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path engines/native/Cargo.toml --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engines/native/Cargo.toml engines/native/src/lib.rs engines/native/src/resumable.rs engines/native/src/streaming_fallback.rs engines/native/src/failure_injection.rs engines/native/tests/failure_injection.rs package.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "N5 failure-injection migration is already applied."
          } else {
            git commit -m "Wire deterministic native disk failure injection"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin "HEAD:$env:HEAD_BRANCH"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify Subutai ownership policy
        shell: powershell
        run: node scripts/native-engine-policy-test.mjs

      - name: Check native engine formatting
        shell: powershell
        run: cargo fmt --manifest-path engines/native/Cargo.toml --all -- --check

      - name: Check native engine quality with test hooks
        shell: powershell
        run: cargo clippy --manifest-path engines/native/Cargo.toml --all-targets --features failure-injection -- -D warnings

      - name: Run native engine unit integration and failure tests
        shell: powershell
        run: cargo test --manifest-path engines/native/Cargo.toml --all-targets --features failure-injection

      - name: Run durable journal self-test
        shell: powershell
        run: cargo run --quiet --manifest-path engines/native/Cargo.toml --bin subutai-engine -- self-test

      - name: Build production release desktop host without test hooks
        shell: powershell
        run: cargo build --release --manifest-path engines/native/Cargo.toml --bin subutai-engine-host

      - name: Enable pnpm
        shell: powershell
        run: |
          corepack enable
          pnpm --version

      - name: Install locked desktop dependencies
        shell: powershell
        run: pnpm install --frozen-lockfile

      - name: Check public Subutai identity
        shell: powershell
        run: pnpm test:brand

      - name: Check release engine packaging policy
        shell: powershell
        run: pnpm test:release-engine

      - name: Check reproducible dependency policy
        shell: powershell
        run: pnpm test:dependency-lock

      - name: Check integrity and redaction policies
        shell: powershell
        run: pnpm test:integrity

      - name: Check mirror fallback policies
        shell: powershell
        run: pnpm test:mirror

      - name: Typecheck desktop and browser integration
        shell: powershell
        run: pnpm typecheck

      - name: Run queue and scheduler tests
        shell: powershell
        run: pnpm test:queue

      - name: Run transfer control tests
        shell: powershell
        run: pnpm test:transfer

      - name: Run batch download tests
        shell: powershell
        run: pnpm test:batch

      - name: Run clipboard monitoring tests
        shell: powershell
        run: pnpm test:clipboard

      - name: Run Site Grabber tests
        shell: powershell
        run: pnpm test:site-grabber

      - name: Run tray and updater tests
        shell: powershell
        run: pnpm test:system

      - name: Run failure and recovery policy tests
        shell: powershell
        run: pnpm test:failure-policy

      - name: Check release version consistency
        shell: powershell
        run: pnpm test:release-version

      - name: Build Subutai desktop
        shell: powershell
        run: pnpm build
