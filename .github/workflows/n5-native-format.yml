name: Subutai N5 Native Format

on:
  pull_request:
    branches: [main]
    paths:
      - "engines/native/**"
      - ".github/workflows/n5-native-format.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, subutai]
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install pinned Rust formatter
        shell: powershell
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          $env:PATH = "$cargoBin;$env:PATH"
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Format and commit native source
        shell: powershell
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          cargo fmt --manifest-path engines/native/Cargo.toml --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engines/native
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Native source is already formatted."
          } else {
            git commit -m "Format N5 native fallback sources"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin "HEAD:$env:HEAD_BRANCH"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
