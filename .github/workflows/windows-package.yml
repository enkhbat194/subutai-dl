name: Subutai Windows Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: pwsh
        run: corepack enable

      - name: Install Subutai download engines
        shell: pwsh
        run: |
          choco install aria2 yt-dlp ffmpeg -y --no-progress
          $engineDir = "apps/desktop/resources/engines/win32-x64"
          New-Item -ItemType Directory -Force $engineDir | Out-Null

          $aria = Get-ChildItem "$env:ChocolateyInstall\lib\aria2*" -Recurse -Filter aria2c.exe | Select-Object -First 1
          $ytdlp = Get-ChildItem "$env:ChocolateyInstall\lib\yt-dlp*" -Recurse -Filter yt-dlp.exe | Select-Object -First 1
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg*" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg*" -Recurse -Filter ffprobe.exe | Select-Object -First 1

          if (-not $aria) { throw "Subutai direct-download engine was not found." }
          if (-not $ytdlp) { throw "Subutai media resolver was not found." }
          if (-not $ffmpeg) { throw "Subutai media processor was not found." }

          Copy-Item $aria.FullName "$engineDir/aria2c.exe"
          Copy-Item $ytdlp.FullName "$engineDir/yt-dlp.exe"
          Copy-Item $ffmpeg.FullName "$engineDir/ffmpeg.exe"
          if ($ffprobe) { Copy-Item $ffprobe.FullName "$engineDir/ffprobe.exe" }

          Get-ChildItem $engineDir -Filter *.exe | ForEach-Object {
            Get-FileHash $_.FullName -Algorithm SHA256
          }

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --no-frozen-lockfile

      - name: Native engine foundation tests
        shell: pwsh
        run: pnpm test:native-engine

      - name: Validate release version
        shell: pwsh
        run: pnpm test:release-version

      - name: Typecheck
        shell: pwsh
        run: pnpm typecheck

      - name: Build installer and portable app
        shell: pwsh
        run: pnpm --filter @subutai/desktop build:win

      - name: Validate packages and packaged app launch
        shell: pwsh
        run: ./scripts/validate-windows-package.ps1 -LaunchSmoke

      - name: Upload Subutai Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Subutai-Windows
          path: |
            apps/desktop/release/Subutai-Setup-*.exe
            apps/desktop/release/Subutai-Portable-*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
