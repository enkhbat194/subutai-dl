name: Apply Subutai Product Cleanup

on:
  push:
    branches: [agent/product-audit-naming-cleanup]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/product-audit-naming-cleanup
          fetch-depth: 0

      - name: Apply product cleanup
        run: node scripts/apply-product-cleanup.mjs

      - name: Remove one-time patch files
        run: rm scripts/apply-product-cleanup.mjs .github/workflows/apply-product-cleanup.yml

      - name: Commit cleanup result
        run: |
          git config user.name "Subutai Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Subutai public identity and errors"
          git push origin HEAD:agent/product-audit-naming-cleanup
