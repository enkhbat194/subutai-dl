name: One-shot app browser profile discovery

on:
  push:
    branches:
      - agent/rc2-app-profile-discovery
    paths:
      - "scripts/apply-app-browser-profile-discovery.mjs"
      - ".github/workflows/one-shot-app-profile-discovery.yml"

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rc2-app-profile-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply runtime browser-profile discovery
        shell: powershell
        run: node scripts/apply-app-browser-profile-discovery.mjs
      - name: Enable pnpm
        shell: powershell
        run: |
          corepack enable
          pnpm --version
      - name: Install locked dependencies
        shell: powershell
        run: pnpm install --frozen-lockfile
      - name: Validate desktop and shared contracts
        shell: powershell
        run: pnpm typecheck
      - name: Remove one-shot patch machinery
        shell: powershell
        run: |
          Remove-Item scripts/apply-app-browser-profile-discovery.mjs -Force
          Remove-Item .github/workflows/one-shot-app-profile-discovery.yml -Force
      - name: Commit validated runtime change
        shell: powershell
        run: |
          git config user.name "subutai-automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/desktop/src/main/engines/media-service.ts scripts/apply-app-browser-profile-discovery.mjs .github/workflows/one-shot-app-profile-discovery.yml
          git diff --cached --check
          git commit -m "Discover installed browser profiles in app media fallback"
          git push origin HEAD:agent/rc2-app-profile-discovery
