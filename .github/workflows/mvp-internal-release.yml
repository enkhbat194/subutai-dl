name: Subutai Internal Windows MVP

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "engines/native/**"
      - "packages/**"
      - "scripts/install-temporary-media-tools.ps1"
      - "scripts/youtube-media-smoke.ps1"
      - "scripts/validate-windows-package.ps1"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mvp-internal-release.yml"
  push:
    branches:
      - "agent/mvp-0.2.0-rc2-usability"
    paths:
      - "apps/**"
      - "engines/native/**"
      - "packages/**"
      - "scripts/install-temporary-media-tools.ps1"
      - "scripts/youtube-media-smoke.ps1"
      - "scripts/validate-windows-package.ps1"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mvp-internal-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: subutai-internal-windows-mvp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 100

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Rust toolchain
        shell: powershell
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          $env:PATH = "$cargoBin;$env:PATH"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.97.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          cargo --version

      - name: Enable pnpm
        shell: powershell
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --version

      - name: Resolve candidate version
        id: version
        shell: powershell
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          if ($version -notmatch '^0\.2\.0-rc\.[1-9][0-9]*$') {
            throw "Internal MVP workflow requires an explicit 0.2.0 RC version; received $version."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install locked dependencies
        shell: powershell
        run: pnpm install --frozen-lockfile

      - name: Install pinned media tools and JavaScript runtime
        shell: powershell
        run: ./scripts/install-temporary-media-tools.ps1

      - name: Prove public YouTube probe and download
        shell: powershell
        run: ./scripts/youtube-media-smoke.ps1

      - name: Typecheck desktop, extension and shared contracts
        shell: powershell
        run: pnpm typecheck

      - name: Build Windows Setup and Portable MVP
        shell: powershell
        run: pnpm --filter @subutai/desktop build:win

      - name: Validate package and launch smoke
        shell: powershell
        run: ./scripts/validate-windows-package.ps1 -LaunchSmoke

      - name: Publish unsigned internal MVP prerelease
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: internal-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          name: Subutai Download Manager ${{ steps.version.outputs.version }} — Internal MVP
          body: |
            UNSIGNED INTERNAL OWNER-TEST BUILD — not a production release.

            This candidate replaces the crowded prototype dashboard with a focused one-link flow and routes recognised YouTube/media URLs automatically.

            Its publication is gated by a real public YouTube probe and media-file download on the Windows runner, package validation and Electron launch smoke.

            Start with `Subutai-Portable-${{ steps.version.outputs.version }}-x64.exe`. Windows SmartScreen may warn because production Authenticode credentials are not configured yet.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/Subutai-Setup-*.exe
            apps/desktop/release/Subutai-Portable-*.exe
            apps/desktop/release/SHA256SUMS.txt
