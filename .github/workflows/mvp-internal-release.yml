name: Subutai Internal Windows MVP

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "engines/native/**"
      - "packages/**"
      - "scripts/install-temporary-media-tools.ps1"
      - "scripts/youtube-media-smoke.ps1"
      - "scripts/owner-youtube-acceptance.ps1"
      - "scripts/Run-Subutai-Owner-Acceptance.cmd"
      - "scripts/restart-recovery-harness.mjs"
      - "scripts/validate-windows-package.ps1"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mvp-internal-release.yml"
  push:
    branches:
      - "agent/rc2-live-owner-acceptance"
    paths:
      - "apps/**"
      - "engines/native/**"
      - "packages/**"
      - "scripts/install-temporary-media-tools.ps1"
      - "scripts/youtube-media-smoke.ps1"
      - "scripts/owner-youtube-acceptance.ps1"
      - "scripts/Run-Subutai-Owner-Acceptance.cmd"
      - "scripts/restart-recovery-harness.mjs"
      - "scripts/validate-windows-package.ps1"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mvp-internal-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: subutai-internal-windows-mvp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 100

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install pinned Rust toolchain
        shell: powershell
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          $env:PATH = "$cargoBin;$env:PATH"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.97.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          cargo --version

      - name: Enable pnpm
        shell: powershell
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --version

      - name: Resolve candidate version
        id: version
        shell: powershell
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          if ($version -notmatch '^0\.2\.0-rc\.[1-9][0-9]*$') {
            throw "Internal MVP workflow requires an explicit 0.2.0 RC version; received $version."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate owner-network acceptance harness syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./scripts/owner-youtube-acceptance.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "owner-youtube-acceptance.ps1 contains PowerShell parse errors."
          }
          cmd.exe /d /c "scripts\Run-Subutai-Owner-Acceptance.cmd --help" > $null 2>&1
          if ($LASTEXITCODE -eq 2) {
            throw "Run-Subutai-Owner-Acceptance.cmd could not locate the PowerShell harness."
          }

      - name: Install locked dependencies
        shell: powershell
        run: pnpm install --frozen-lockfile

      - name: Install pinned media tools and JavaScript runtime
        shell: powershell
        run: ./scripts/install-temporary-media-tools.ps1

      - name: Prove packaged media stack and attempt public YouTube
        shell: powershell
        run: ./scripts/youtube-media-smoke.ps1

      - name: Typecheck desktop, extension and shared contracts
        shell: powershell
        run: pnpm typecheck

      - name: Build native direct engine for live transfer acceptance
        shell: powershell
        run: cargo build --release --manifest-path engines/native/Cargo.toml --bin subutai-engine

      - name: Prove live HTTP interruption and durable restart recovery
        shell: powershell
        env:
          SUBUTAI_RESTART_WORKSPACE: ${{ runner.temp }}\subutai-owner-acceptance\restart
          SUBUTAI_RESTART_FILE_MIB: 64
          SUBUTAI_RESTART_MINIMUM_PROGRESS_MIB: 8
          SUBUTAI_RESTART_SEGMENTS: 8
        run: node scripts/restart-recovery-harness.mjs self-test

      - name: Run transfer pause resume control contracts
        shell: powershell
        run: pnpm test:transfer

      - name: Build Windows Setup and Portable MVP
        shell: powershell
        run: pnpm --filter @subutai/desktop build:win

      - name: Validate package and launch smoke
        shell: powershell
        run: ./scripts/validate-windows-package.ps1 -LaunchSmoke

      - name: Publish unsigned internal MVP prerelease
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: internal-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          name: Subutai Download Manager ${{ steps.version.outputs.version }} — Internal MVP
          body: |
            UNSIGNED INTERNAL OWNER-TEST BUILD — not a production release.

            This candidate replaces the crowded prototype dashboard with a focused one-link flow and routes recognised YouTube/media URLs automatically.

            Publication requires the packaged yt-dlp/FFmpeg/Node media stack to download and validate a real media file, a live 64 MiB local HTTP transfer to be interrupted with durable partial/journal state and resumed to an exact SHA-256 match, transfer pause/resume control contracts, TypeScript checks, Windows Setup/Portable construction and packaged Electron launch smoke. The workflow also attempts a public YouTube download. GitHub-hosted datacenter IPs can be challenged by YouTube; if that happens, the workflow records owner-network YouTube acceptance as pending instead of misclassifying the packaged media stack as broken.

            Start with `Subutai-Portable-${{ steps.version.outputs.version }}-x64.exe`. For the final owner-network YouTube gate, download `owner-youtube-acceptance.ps1` and `Run-Subutai-Owner-Acceptance.cmd` beside each other and run the CMD on the owner Windows machine. Windows SmartScreen may warn because this owner-test build is unsigned.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/Subutai-Setup-*.exe
            apps/desktop/release/Subutai-Portable-*.exe
            apps/desktop/release/SHA256SUMS.txt
            scripts/owner-youtube-acceptance.ps1
            scripts/Run-Subutai-Owner-Acceptance.cmd
