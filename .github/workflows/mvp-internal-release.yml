name: Subutai Internal Windows MVP

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "engines/native/**"
      - "packages/**"
      - "scripts/install-temporary-media-tools.ps1"
      - "scripts/youtube-media-smoke.ps1"
      - "scripts/owner-youtube-acceptance.ps1"
      - "scripts/owner-critical-packaged-acceptance.mjs"
      - "scripts/Run-Subutai-Owner-Acceptance.cmd"
      - "scripts/direct-download-smoke.mjs"
      - "scripts/restart-recovery-harness.mjs"
      - "scripts/validate-windows-package.ps1"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mvp-internal-release.yml"
  push:
    branches:
      - "agent/rc2-live-owner-acceptance"
    paths:
      - "apps/**"
      - "engines/native/**"
      - "packages/**"
      - "scripts/install-temporary-media-tools.ps1"
      - "scripts/youtube-media-smoke.ps1"
      - "scripts/owner-youtube-acceptance.ps1"
      - "scripts/owner-critical-packaged-acceptance.mjs"
      - "scripts/Run-Subutai-Owner-Acceptance.cmd"
      - "scripts/direct-download-smoke.mjs"
      - "scripts/restart-recovery-harness.mjs"
      - "scripts/validate-windows-package.ps1"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mvp-internal-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: subutai-internal-windows-mvp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 100

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install pinned Rust toolchain
        shell: powershell
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          $env:PATH = "$cargoBin;$env:PATH"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.97.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          cargo --version

      - name: Enable pnpm
        shell: powershell
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --version

      - name: Resolve candidate version
        id: version
        shell: powershell
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          if ($version -notmatch '^0\.2\.0-rc\.[1-9][0-9]*$') {
            throw "Internal MVP workflow requires an explicit 0.2.0 RC version; received $version."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate owner-network acceptance harness syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./scripts/owner-youtube-acceptance.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "owner-youtube-acceptance.ps1 contains PowerShell parse errors."
          }
          node --check ./scripts/owner-critical-packaged-acceptance.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path ./scripts/Run-Subutai-Owner-Acceptance.cmd)) {
            throw "Run-Subutai-Owner-Acceptance.cmd is missing."
          }

      - name: Install locked dependencies
        shell: powershell
        run: pnpm install --frozen-lockfile

      - name: Install pinned media tools and JavaScript runtime
        shell: powershell
        run: ./scripts/install-temporary-media-tools.ps1

      - name: Prove packaged media stack and attempt public YouTube
        shell: powershell
        run: ./scripts/youtube-media-smoke.ps1

      - name: Typecheck desktop, extension and shared contracts
        shell: powershell
        run: pnpm typecheck

      - name: Build native direct engine for live transfer acceptance
        shell: powershell
        run: cargo build --release --manifest-path engines/native/Cargo.toml --bin subutai-engine

      - name: Prove normal HTTP download through the native engine
        shell: powershell
        env:
          SUBUTAI_NATIVE_ENGINE_PATH: ${{ github.workspace }}\engines\native\target\release\subutai-engine.exe
        run: node scripts/direct-download-smoke.mjs

      - name: Prove live HTTP interruption and durable restart recovery
        shell: powershell
        env:
          SUBUTAI_RESTART_WORKSPACE: ${{ runner.temp }}\subutai-owner-acceptance\restart
          SUBUTAI_RESTART_FILE_MIB: 64
          SUBUTAI_RESTART_MINIMUM_PROGRESS_MIB: 8
          SUBUTAI_RESTART_SEGMENTS: 8
        run: node scripts/restart-recovery-harness.mjs self-test

      - name: Run transfer pause resume control contracts
        shell: powershell
        run: pnpm test:transfer

      - name: Build Windows Setup and Portable MVP
        shell: powershell
        run: pnpm --filter @subutai/desktop build:win

      - name: Prove packaged desktop host direct pause resume and restart recovery
        shell: powershell
        env:
          SUBUTAI_OWNER_CRITICAL_MIB: 64
        run: |
          $appRoot = (Resolve-Path ./apps/desktop/release/win-unpacked).Path
          $node = Join-Path $appRoot "resources\engines\node.exe"
          $acceptance = Join-Path $appRoot "resources\owner-acceptance\owner-critical-packaged-acceptance.mjs"
          if (-not (Test-Path $node)) { throw "Packaged Node runtime is missing: $node" }
          if (-not (Test-Path $acceptance)) { throw "Packaged critical acceptance harness is missing: $acceptance" }
          & $node $acceptance $appRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate package and launch smoke
        shell: powershell
        run: ./scripts/validate-windows-package.ps1 -LaunchSmoke

      - name: Publish unsigned internal MVP prerelease
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: internal-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          name: Subutai Download Manager ${{ steps.version.outputs.version }} — Internal MVP
          body: |
            UNSIGNED INTERNAL OWNER-TEST BUILD — not a production release.

            This candidate replaces the crowded prototype dashboard with a focused one-link flow and routes recognised YouTube/media URLs automatically.

            Publication requires a checksum-verified normal HTTP download through the first-party native engine, a live 64 MiB interruption/restart recovery run, transfer pause/resume contracts, and an additional packaged `subutai-engine-host.exe` acceptance that performs normal HTTP, explicit pause/resume, controller shutdown/restart, durable recovery-state verification and exact SHA-256 completion using the same binaries shipped in the Windows package. It also requires the packaged yt-dlp/FFmpeg/Node media stack, TypeScript checks, Windows Setup/Portable construction and packaged Electron launch smoke. The workflow attempts a public YouTube download; GitHub-hosted datacenter IPs can be challenged by YouTube, so owner-network YouTube acceptance remains a separate physical-owner gate when that occurs.

            Start with `Subutai-Portable-${{ steps.version.outputs.version }}-x64.exe`. The owner-network YouTube acceptance launcher and critical direct acceptance harness are bundled under `resources\owner-acceptance` inside the Windows package. Windows SmartScreen may warn because this owner-test build is unsigned.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            apps/desktop/release/Subutai-Setup-*.exe
            apps/desktop/release/Subutai-Portable-*.exe
            apps/desktop/release/SHA256SUMS.txt
            scripts/owner-youtube-acceptance.ps1
            scripts/Run-Subutai-Owner-Acceptance.cmd
