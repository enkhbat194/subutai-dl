name: Apply Production Resilience

on:
  push:
    branches: [agent/production-resilience]
    paths:
      - .github/apply-production-resilience.py
      - .github/workflows/apply-production-resilience.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-resilience
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply integration patch
        run: python .github/apply-production-resilience.py
      - name: Remove one-time patch files
        run: rm .github/apply-production-resilience.py .github/workflows/apply-production-resilience.yml
      - name: Commit integration
        run: |
          git config user.name "Subutai Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate production resilience runtime and tests"
          git push origin HEAD:agent/production-resilience
