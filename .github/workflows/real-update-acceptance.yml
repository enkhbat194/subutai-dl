name: Subutai Real Two-Installer Update Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/extension/**"
      - "engines/native/**"
      - "scripts/run-real-update-acceptance-safely.ps1"
      - "scripts/run-real-update-acceptance-monitored.ps1"
      - "scripts/real-two-installer-acceptance.ps1"
      - "scripts/real-update-state-probe.mjs"
      - "scripts/real-update-feed-server.mjs"
      - "scripts/real-update-acceptance-policy-test.mjs"
      - "scripts/updater-rollback-acceptance.mjs"
      - "scripts/updater-two-build-acceptance.mjs"
      - "scripts/updater-transaction-test.mts"
      - "scripts/updater-rollback-policy-test.mjs"
      - "scripts/install-temporary-media-tools.ps1"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/real-update-acceptance.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-two-installer-acceptance:
    name: real-update-subutai-windows
    runs-on: [self-hosted, Windows, X64, subutai]
    timeout-minutes: 180

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Rust toolchain
        shell: powershell
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $rustupInstaller = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
            Invoke-WebRequest "https://win.rustup.rs/x86_64" -OutFile $rustupInstaller
            & $rustupInstaller -y --profile minimal --default-toolchain none
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $env:PATH = "$cargoBin;$env:PATH"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.97.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          cargo --version

      - name: Enable pnpm
        shell: powershell
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install locked dependencies
        shell: powershell
        run: pnpm install --frozen-lockfile

      - name: Install pinned temporary media tools
        shell: powershell
        run: ./scripts/install-temporary-media-tools.ps1

      - name: Verify updater and real acceptance policies
        shell: powershell
        run: |
          pnpm test:updater-policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:updater-acceptance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:real-update-policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run real Setup A to Setup B update and rollback acceptance
        shell: powershell
        run: |
          $env:GITHUB_SHA = "${{ github.event.pull_request.head.sha || github.sha }}"
          ./scripts/run-real-update-acceptance-monitored.ps1 -BaselineVersion 0.1.0 -TargetVersion 0.2.0 -Workspace artifacts/real-update-acceptance -ScenarioTimeoutSeconds 240

      - name: Publish acceptance evidence summary
        if: always()
        shell: powershell
        run: |
          $report = "artifacts/real-update-acceptance/evidence/real-two-installer-acceptance-report.json"
          if (Test-Path $report) {
            "## Subutai real two-installer acceptance" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            Get-Content $report -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            "Real two-installer acceptance report was not produced." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Print bounded acceptance diagnostics
        if: always()
        shell: powershell
        run: |
          $roots = @(
            "artifacts/real-update-acceptance/evidence",
            "artifacts/real-update-acceptance/logs"
          )
          $files = foreach ($root in $roots) {
            if (Test-Path -LiteralPath $root) {
              Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Extension -in @('.json', '.log') }
            }
          }
          if (-not $files) {
            Write-Host "No real-update diagnostic files were produced."
          } else {
            foreach ($file in @($files | Sort-Object FullName)) {
              Write-Host "::group::diagnostic $($file.FullName) ($($file.Length) bytes; last 400 lines)"
              Get-Content -LiteralPath $file.FullName -Tail 400 -ErrorAction Continue
              Write-Host "::endgroup::"
            }
          }

      - name: Preserve private acceptance evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: subutai-real-update-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/real-update-acceptance/evidence/**/*.json
            artifacts/real-update-acceptance/logs/**/*.log
            artifacts/real-update-acceptance/logs/**/*server-state.json
          if-no-files-found: warn
          retention-days: 30
