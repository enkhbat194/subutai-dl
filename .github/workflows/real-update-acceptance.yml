name: Subutai Real Two-Installer Update Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/extension/**"
      - "scripts/real-two-installer-update-acceptance.ps1"
      - "scripts/loopback-update-server.mjs"
      - ".github/workflows/real-update-acceptance.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-update-acceptance:
    name: real-two-installer-windows
    runs-on: [self-hosted, Windows, X64, subutai]
    timeout-minutes: 120

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Rust toolchain
        shell: powershell
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $installer = Join-Path $env:RUNNER_TEMP "rustup-init.exe"
            Invoke-WebRequest "https://win.rustup.rs/x86_64" -OutFile $installer
            & $installer -y --profile minimal --default-toolchain none
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $env:PATH = "$cargoBin;$env:PATH"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.97.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enable pnpm
        shell: powershell
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install locked dependencies
        shell: powershell
        run: pnpm install --frozen-lockfile

      - name: Typecheck acceptance runtime
        shell: powershell
        run: pnpm typecheck

      - name: Run updater policy and fixture regressions
        shell: powershell
        run: |
          pnpm test:updater-policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:updater-acceptance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run real two-installer update and rollback acceptance
        shell: powershell
        run: ./scripts/real-two-installer-update-acceptance.ps1

      - name: Verify repository stayed at committed versions
        shell: powershell
        run: |
          git diff --exit-code -- package.json apps/desktop/package.json apps/extension/package.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subutai-real-update-acceptance-${{ github.sha }}
          path: |
            artifacts/real-update-acceptance/**
          if-no-files-found: warn
          retention-days: 14
